name: macOS-CI
# This ran `on: push` on the macos-11 label GitHub retired in 2024-06:
# every push queued both matrix legs for a runner that can never exist
# and GitHub auto-cancelled each run at 24h (~8,640 runner-min in 30
# days, all wasted). Manual dispatch only now; the label is moved to
# macos-15-intel (the brew paths below are Intel /usr/local) and the
# job is bounded at 120 min.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  # ref_type in the group: a tag dispatch would otherwise cancel an
  # in-progress branch build before the job-level ref gate skips it.
  group: macos-ci-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  macOS-CI:
    strategy:
      matrix:
        glx_option: ['dri', 'xlib']
    runs-on: macos-15-intel
    timeout-minutes: 120
    # workflow_dispatch lets you pick a tag; a skipped job never takes a
    # runner (a gate step would already be running on one).
    if: github.ref_type == 'branch'
    env:
      GALLIUM_DUMP_CPU: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        cat > Brewfile <<EOL
        brew "bison"
        brew "expat"
        brew "gettext"
        brew "libx11"
        brew "libxcb"
        brew "libxdamage"
        brew "libxext"
        brew "molten-vk"
        brew "ninja"
        brew "pkg-config"
        brew "python@3.10"
        EOL

        brew update
        # llvm is intentionally absent: Homebrew builds no x86_64 macOS bottles for any
        # llvm formula, so on macos-15-intel it compiles for hours past the 120-minute
        # job limit (run 44669319600 died inside its dependency chain). softpipe+zink
        # need no LLVM; llvmpipe stays off via -Dllvm=disabled below.
        brew bundle --verbose --no-upgrade
    - name: Install Mako and meson
      # python3 -m pip pins the interpreter so the user-site bin dir below is
      # the one meson actually lands in (the image's default is 3.9; a Brewfile
      # python would put it somewhere else).
      run: |
        python3 -m pip install --user mako meson
        MESON_EXEC="$(python3 -m site --user-base)/bin/meson"
        echo "MESON_EXEC=$MESON_EXEC" >> "$GITHUB_ENV"
        "$MESON_EXEC" --version
    - name: Configure
      run: |
        "$MESON_EXEC" . build -Dmoltenvk-dir=$(brew --prefix molten-vk) -Dbuild-tests=true -Dllvm=disabled -Dgallium-drivers=softpipe,zink -Dglx=${{ matrix.glx_option }}
    - name: Build
      run: $MESON_EXEC compile -C build
    - name: Test
      run: $MESON_EXEC test -C build --print-errorlogs
    - name: Install
      run: $MESON_EXEC install -C build --destdir $PWD/install
    - name: 'Upload Artifact'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.glx_option }}-result
        path: |
          build/meson-logs/
          install/
        retention-days: 5
