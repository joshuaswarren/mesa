name: macOS-CI
# This ran `on: push` on the macos-11 label GitHub retired in 2024-06:
# every push queued both matrix legs for a runner that can never exist
# and GitHub auto-cancelled each run at 24h (~8,640 runner-min in 30
# days, all wasted). Manual dispatch only now; the label is moved to
# macos-15-intel (the brew paths below are Intel /usr/local) and the
# job is bounded at 120 min.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: macos-ci
  cancel-in-progress: true

jobs:
  macOS-CI:
    strategy:
      matrix:
        glx_option: ['dri', 'xlib']
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      GALLIUM_DUMP_CPU: true
    steps:
    - name: Branch gate
      # workflow_dispatch lets you pick a tag; the build is meant for branch
      # heads only.
      run: case "$GITHUB_REF" in refs/heads/*) ;; *) echo "::error::dispatch ref $GITHUB_REF is not a branch"; exit 1;; esac
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        cat > Brewfile <<EOL
        brew "bison"
        brew "expat"
        brew "gettext"
        brew "libx11"
        brew "libxcb"
        brew "libxdamage"
        brew "libxext"
        brew "llvm"
        brew "molten-vk"
        brew "ninja"
        brew "pkg-config"
        brew "python@3.10"
        EOL

        brew update
        brew bundle --verbose
    - name: Install Mako and meson
      # python3 -m pip pins the interpreter so the user-site bin dir below is
      # the one meson actually lands in (the image's default is 3.9; a Brewfile
      # python would put it somewhere else).
      run: |
        python3 -m pip install --user mako meson
        echo "MESON_EXEC=$(python3 -m site --user-base)/bin/meson" >> "$GITHUB_ENV"
        "$MESON_EXEC" --version
    - name: Configure
      run: |
        cat > native_config <<EOL
        [binaries]
        llvm-config = '$(brew --prefix llvm)/bin/llvm-config'
        EOL
        cat native_config
        "$MESON_EXEC" . build --native-file=native_config -Dmoltenvk-dir=$(brew --prefix molten-vk) -Dbuild-tests=true -Dgallium-drivers=swrast,zink -Dglx=${{ matrix.glx_option }}
    - name: Build
      run: $MESON_EXEC compile -C build
    - name: Test
      run: $MESON_EXEC test -C build --print-errorlogs
    - name: Install
      run: $MESON_EXEC install -C build --destdir $PWD/install
    - name: 'Upload Artifact'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.glx_option }}-result
        path: |
          build/meson-logs/
          install/
        retention-days: 5
