name: macOS-CI
# This ran `on: push` on the macos-11 label GitHub retired in 2024-06:
# every push queued both matrix legs for a runner that can never exist
# and GitHub auto-cancelled each run at 24h (~8,640 runner-min in 30
# days, all wasted). Manual dispatch only now; the label is moved to
# macos-15-intel (the brew paths below are Intel /usr/local) and the
# job is bounded at 120 min.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: macos-ci
  cancel-in-progress: true

jobs:
  macOS-CI:
    strategy:
      matrix:
        glx_option: ['dri', 'xlib']
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      GALLIUM_DUMP_CPU: true
      MESON_EXEC: /Users/runner/Library/Python/3.11/bin/meson
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        cat > Brewfile <<EOL
        brew "bison"
        brew "expat"
        brew "gettext"
        brew "libx11"
        brew "libxcb"
        brew "libxdamage"
        brew "libxext"
        brew "molten-vk"
        brew "ninja"
        brew "pkg-config"
        brew "python@3.10"
        EOL

        brew update
        brew bundle --verbose
    - name: Install Mako and meson
      run: pip3 install --user mako meson
    - name: Configure
      run: |
        cat > native_config <<EOL
        [binaries]
        llvm-config = '/usr/local/opt/llvm/bin/llvm-config'
        EOL
        $MESON_EXEC . build --native-file=native_config -Dmoltenvk-dir=$(brew --prefix molten-vk) -Dbuild-tests=true -Dgallium-drivers=swrast,zink -Dglx=${{ matrix.glx_option }}
    - name: Build
      run: $MESON_EXEC compile -C build
    - name: Test
      run: $MESON_EXEC test -C build --print-errorlogs
    - name: Install
      run: $MESON_EXEC install -C build --destdir $PWD/install
    - name: 'Upload Artifact'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.glx_option }}-result
        path: |
          build/meson-logs/
          install/
        retention-days: 5
