name: pr-readiness

# Merge-readiness comment and labels on every open pull request.
# The logic lives in aurora-silicon/.github; this file only says when to run.
# Rules: https://github.com/aurora-silicon/agent-guidelines/blob/main/docs/MAINTAINER-HANDBOOK.md

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (empty = every open pull request)
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  # Comments get their own group without cancelling, so a stream of
  # comments (or a bot's) never cancels a push or review run.
  group: pr-readiness-${{ github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || github.event.pull_request.number || inputs.pr || 'sweep' }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

jobs:
  readiness:
    # Reviews on pull requests from forks get a read-only token, and the
    # bot's own comments do not matter; the sweep picks those up.
    if: >-
      github.repository_owner == 'aurora-silicon' &&
      (github.event_name != 'pull_request_review' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.type != 'Bot'))
    uses: aurora-silicon/.github/.github/workflows/pr-readiness.yml@main
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr || '') }}
