<?xml version="1.0"?>
<driconf>
    <device driver="hk">
        <engine engine_name_match="DXVK|vkd3d">
           <!--
              The amount of bug reports we get about Honeykrisp being slow
           outweighs the number of games that need custom border emulation.
           I'm tired.
           -->
           <option name="hk_disable_border_emulation" value="true" />
           <!--
            Needed for FL11_1. While nominally conformant, CTS hits piles
            of timeouts (== flakes & fails & other fun times), especially on
            min-spec M1. Therefore the feature is hidden. I don't expect native
            apps to use this.
            -->
           <option name="hk_enable_vertex_pipeline_stores_atomics" value="true" />
           <!--
              DXVK and vkd3d-proton turn on their tiler render pass handling,
              and DXVK leaves constant arrays to the driver, only for the
              driver IDs they know. Until their releases know
              VK_DRIVER_ID_AURORA_BOREALIS, report the Honeykrisp ID to them
              so they keep treating Borealis as the tiler it is.
              -->
           <option name="hk_report_honeykrisp_driver_id" value="true" />
           <!--
              Direct3D picks the upper level at exactly LOD x.5 with a point
              mip filter. The hardware follows Vulkan.
              -->
           <option name="hk_d3d_nearest_mip" value="true" />
       </engine>

        <engine engine_name_match="vkd3d">
            <!--
               Apple hardware lacks min/max filtering, but this is required for
               FL12_0. Fortunately, this is an obscure feature and we support
               the rest of FL12_0, so we prefer to fake support and fail D3D
               conformance rather than be limited to FL11.
               -->
            <option name="hk_fake_minmax" value="true" />

            <!--
               Tiled resources tier 2, which FL12_0 needs, requires strict
               residency. G13, G14 and G17P read an unbound page as zero, but
               a write to one can be read back afterwards (dEQP-VK.sparse_resources
               .buffer.ssbo.*strict* with writes), so it is reported to
               vkd3d-proton only, as with min/max filtering above.
               -->
            <option name="hk_sparse_strict_residency" value="true" />

            <!---
               We need this for FL12_0, but we only implement it for vkd3d
               because it's not the speediest thing.
               -->
            <option name="hk_image_view_min_lod" value="true" />
        </engine>

        <application name="Counter-Strike 2" application_name_match="csgo">
            <!--
               Its multisample render targets and many textures are mutable
               without a format list, but every view only changes sRGB-ness.
               Compressing them is +5% at 4x MSAA. Compressed data does not
               decode through views of other channel layouts, so the
               assumption is per application; hk_CreateImageView() reports a
               violation.
               -->
            <option name="hk_mutable_format_srgb_pair" value="true" />
            <!--
               Submit at most two commands per kernel ioctl, so the GPU starts
               work from the first ioctl while the kernel validates later
               ioctls. The gain was measured on the M5 Max only.
               -->
            <option name="hk_submit_batch_size" value="2" />
        </application>

        <application name="llama.cpp (ggml-vulkan)" application_name_match="^ggml-vulkan$">
            <!--
               ggml-vulkan picks its matrix multiply tile sizes by driver ID
               and only knows VK_DRIVER_ID_MESA_HONEYKRISP for this GPU
               family. With any other ID it picks the large tile, which
               spills (239 registers, 624 bytes of scratch per thread on
               G17C) and runs prompt processing 2.7x slower. Report the
               Honeykrisp ID to it until ggml-vulkan knows
               VK_DRIVER_ID_AURORA_BOREALIS.
               -->
            <option name="hk_report_honeykrisp_driver_id" value="true" />
        </application>
    </device>
</driconf>
